# One-command stack: Postgres + the API. `make up` builds and starts both; the
# API waits for a healthy database, migrates, seeds demo data, then serves.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: democrance
      POSTGRES_PASSWORD: democrance
      POSTGRES_DB: democrance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U democrance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:-insecure-compose-key-change-me}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DATABASE_URL: postgres://democrance:democrance@db:5432/democrance
      # Reviewer convenience: open the API and load demo data on first boot.
      DEMO_OPEN_API: ${DEMO_OPEN_API:-True}
      SEED_DEMO: ${SEED_DEMO:-1}
      SECURE_SSL_REDIRECT: "False"
    ports:
      - "8000:8000"

volumes:
  pgdata:
