[project]
name = "democrance-insurance-api"
version = "1.0.0"
description = "Quote and policy lifecycle API for the Democrance technical test."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]
# Respect excludes even when files are passed explicitly (git hook / pre-commit).
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"**/tests/*.py" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
addopts = "-ra --cov=apps --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/apps.py",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
